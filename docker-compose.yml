version: '3'

services:
  payload:
    image: node:22-alpine
    ports:
      - '3002:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    # Turbopack panics ("Next.js package not found") when traversing pnpm's
    # symlinked node_modules across the docker volume boundary. Use webpack
    # in the container instead.
    command: sh -c "corepack enable && pnpm install && pnpm exec next dev --webpack"
    env_file:
      - .env

  # Database is the managed Postgres on 188.245.208.143:5486 (set via DATABASE_URL
  # in .env). No local DB container is provisioned. If you need to run fully
  # offline, add a `postgres:16-alpine` service and point DATABASE_URL at it.

volumes:
  node_modules:
